<header class="sticky top-0 z-50 border-b border-orange-100 bg-white/90 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="group flex items-center gap-2">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 text-lg font-bold text-white shadow-lg shadow-orange-200 transition group-hover:scale-105"
      >
        S
      </span>
      <span class="text-xl font-bold tracking-tight text-gray-900">
        Shop<span class="text-orange-500">Orange</span>
      </span>
    </a>

    <nav class="hidden items-center gap-8 md:flex">
      <a
        routerLink="/"
        routerLinkActive="text-orange-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="font-medium text-gray-600 transition hover:text-orange-500"
      >
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive="text-orange-500"
        class="font-medium text-gray-600 transition hover:text-orange-500"
      >
        Products
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <a
        routerLink="/cart"
        class="relative flex items-center gap-2 rounded-full bg-orange-50 px-4 py-2 font-medium text-orange-600 transition hover:bg-orange-100"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
          />
        </svg>
        <span class="hidden sm:inline">Cart</span>
        @if (itemCount() > 0) {
          <span
            class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-xs font-bold text-white"
          >
            {{ itemCount() }}
          </span>
        }
      </a>
    </div>
  </div>
</header>
